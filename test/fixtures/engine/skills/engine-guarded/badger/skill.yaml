apiVersion: badger/v1alpha1
kind: Skill
metadata:
  name: engine-guarded
  version: "1.0.0"
  description: Synthetic confirmation guardrail Engine fixture
goal:
  statement: Complete one confirmed synthetic Engine action
  inputs: []
  outputs: []
  success:
    - The confirmed action completed
orchestration:
  mode: deterministic
  entry: write
  steps:
    - id: write
      action:
        type: call_tool
        ref: writer
tools:
  - id: writer
    kind: function
    source: synthetic-writer
    sideEffect: write
    requiresConfirmation: true
skills: []
agents: []
