apiVersion: comet/v1alpha1
kind: Skill
metadata:
  name: engine-multi
  version: "1.0.0"
  description: Synthetic two-step Engine fixture
goal:
  statement: Complete two synthetic Engine actions
  inputs: []
  outputs: []
  success:
    - Both actions completed
orchestration:
  mode: deterministic
  entry: first
  steps:
    - id: first
      action:
        type: checkpoint
      next: second
    - id: second
      action:
        type: checkpoint
skills: []
agents: []
tools: []
