# A local Badger deployment: the server and worker roles against Postgres 17.
# Both roles run the same image and share its storage volume; the worker runs
# source checks and other queued jobs.
#
# This stack runs with no people-facing identity: /health proves the image,
# Postgres, and the migrations, and every person route answers 401. A
# deployment on an organization's AI platform keeps its own compose file and
# sets `BADGER_IDENTITY=platform-session` there, with the BADGER_PLATFORM_*
# settings the README describes. For local single-user mode with the implicit
# Administrator, run the server directly (`npm start -w packages/server`).
#
# The database credentials below are development values, not secrets.
#
#   docker compose up --build
#   curl http://localhost:8787/health

name: badger

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: badger
      POSTGRES_PASSWORD: badger
      POSTGRES_DB: badger
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badger -d badger"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: &badger-build
      context: .
      dockerfile: packages/server/Dockerfile
      args:
        BADGER_REVISION: ${BADGER_REVISION:-unknown}
        BADGER_CLEAN_TREE: ${BADGER_CLEAN_TREE:-}
    environment: &badger-environment
      BADGER_MODE: service
      BADGER_IDENTITY: none
      BADGER_HOST: 0.0.0.0
      BADGER_PORT: "8787"
      BADGER_DATABASE_URL: postgres://badger:badger@postgres:5432/badger
      BADGER_ALLOWED_HOSTNAMES: localhost,127.0.0.1
      BADGER_ALLOWED_ORIGINS: http://localhost:8787
    volumes:
      - badger-files:/app/.badger
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: *badger-build
    command: ["node", "packages/server/dist/src/worker.js"]
    environment: *badger-environment
    volumes:
      - badger-files:/app/.badger
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  badger-files:
